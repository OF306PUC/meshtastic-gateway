{% extends "base.html" %}
{% block nav_map %}active{% endblock %}

{% block head %}
<script src="{{ url_for('static', filename='vendor/protomaps-leaflet-5.1.0/protomaps-leaflet.js') }}"></script>
{% endblock %}

{% block content %}
<div id="map"></div>
<div id="map-status"><span id="nodes-status">Fetching node positions…</span><span id="relief-status"></span></div>

<script>
(function () {
    "use strict";

    // Rapa Nui, the field site: the map opens on it, and stays there until the
    // nodes say where to look. No world view: the basemap holds only its boxes.
    const HOME = [[-27.21, -109.46], [-27.05, -109.21]];
    const map = L.map("map", { minZoom: 9, maxZoom: 18 }).fitBounds(HOME);
    const markerLayer = L.layerGroup().addTo(map);

    // Basemap and relief contours come from static/maps (see its fetch.sh), so the
    // map works without internet. Outside the boxes cut out there it is blank.
    protomapsL.leafletLayer({
        url: {{ maps.basemap | tojson }},
        flavor: "dark",
        lang: "es",
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> · <a href="https://protomaps.com">Protomaps</a>'
    }).addTo(map);

    const reliefLayer = L.layerGroup().addTo(map);
    L.control.layers(null, { "Elevation and depth": reliefLayer }).addTo(map);
    const reliefStatus = document.getElementById("relief-status");

    // Land in a muted sand, lighter going up, so the orange nodes stand out on
    // it; sea in blues, darker going down.
    function reliefColour(m) {
        if (m > 0) return `hsl(45, 18%, ${42 + 33 * Math.min(m / 500, 1)}%)`;
        const t = Math.min(Math.log(-m / 100) / Math.log(20), 1);
        return `hsl(200, 80%, ${75 - 40 * t}%)`;
    }

    fetch({{ maps.relief | tojson }})
        .then(r => {
            if (!r.ok) throw new Error(`HTTP ${r.status}`);
            return r.json();
        })
        .then(data => {
            L.geoJSON(data, {
                style: f => ({ color: reliefColour(f.properties.elevation_m), weight: 1.2, opacity: 0.9 }),
                onEachFeature: (f, line) => {
                    const m = f.properties.elevation_m;
                    line.bindTooltip(m > 0 ? `${m} m above sea level` : `${-m} m deep`, { sticky: true });
                }
            }).addTo(reliefLayer);
            map.attributionControl.addAttribution("Relief: GEBCO 2020");
        })
        .catch(e => { reliefStatus.textContent = `Relief contours unavailable: ${e.message}`; console.error(e); });

    const status = document.getElementById("nodes-status");
    // A node in SASIPA's orange: filled where it was measured, dashed and
    // hollow where it is only planned.
    const css = getComputedStyle(document.documentElement);
    const NODE = css.getPropertyValue("--node").trim();
    const NODE_STYLE = { radius: 9, color: css.getPropertyValue("--bg").trim(), weight: 2,
                         fillColor: NODE, fillOpacity: 0.95 };
    const PLANNED_STYLE = { radius: 9, color: NODE, weight: 2.5, dashArray: "4 3",
                            fillColor: NODE, fillOpacity: 0.15 };

    // Uptime is how long the node has lived since its last boot: HH:MM:SS,
    // with hours past 24 rather than days.
    function fmtDuration(seconds) {
        const t = Math.max(0, Math.round(seconds));
        const pad = n => String(n).padStart(2, "0");
        return `${pad(Math.floor(t / 3600))}:${pad(Math.floor(t % 3600 / 60))}:${pad(t % 60)}`;
    }

    function fmtWhen(iso) {
        return new Date(iso).toLocaleString([], { month: "2-digit", day: "2-digit",
                                                  hour: "2-digit", minute: "2-digit" });
    }

    function load() {
        fetch("/api/nodes")
            .then(async r => {
                const body = await r.json();
                // A failed query is an error to show, not an empty mesh.
                if (!r.ok) throw new Error(body.error || `HTTP ${r.status}`);
                return body;
            })
            .then(nodes => {
                if (!nodes.length) {
                    status.textContent = "No node has a position yet: none surveyed, planned or reported over GPS.";
                    return;
                }
                const planned = nodes.filter(n => n.source === "planned").length;
                status.textContent = `${nodes.length} node(s) found` +
                    (planned ? `, ${planned} only at a planned site (dashed)` : "") +
                    (nodes.some(n => n.node_id) ? " — click a marker to open the live dashboard." : ".");

                // Nodes at one point (a relay beside its gateway) share a marker:
                // otherwise the top one hides the rest.
                const sites = new Map();
                nodes.forEach(n => {
                    const key = `${n.lat},${n.lon},${n.source === "planned"}`;
                    if (!sites.has(key)) sites.set(key, []);
                    sites.get(key).push(n);
                });

                markerLayer.clearLayers();
                const bounds = [];
                sites.forEach(group => {
                    const { lat, lon, source } = group[0];
                    // A planned site is a desk choice, not a measurement: drawn apart.
                    const marker = L.circleMarker([lat, lon],
                        source === "planned" ? PLANNED_STYLE : NODE_STYLE).addTo(markerLayer);
                    bounds.push([lat, lon]);

                    const popup = document.createElement("div");
                    group.forEach((n, i) => {
                        if (i) popup.appendChild(document.createElement("hr"));
                        const title = document.createElement("b");
                        title.textContent = n.node_label || n.node_id;
                        const id = document.createElement("small");
                        id.textContent = (n.node_id || "no node id yet") +
                            (n.source === "planned" ? " · planned site" : "");
                        popup.append(title, document.createElement("br"), id);
                        if (n.uptime_s !== undefined) {
                            // The reading's own time: a node silent for a day still
                            // shows the uptime it last reported.
                            const up = document.createElement("div");
                            up.textContent = `Uptime ${fmtDuration(n.uptime_s)} `;
                            const when = document.createElement("small");
                            when.className = "muted";
                            when.textContent = `· reported ${fmtWhen(n.uptime_at)}`;
                            up.appendChild(when);
                            popup.appendChild(up);
                        }
                        if (n.node_id) {
                            const link = document.createElement("a");
                            link.href = `/dashboard?node=${encodeURIComponent(n.node_id)}`;
                            link.textContent = "Open dashboard →";
                            popup.append(link);
                        }
                    });
                    const coords = document.createElement("small");
                    coords.className = "muted";
                    coords.textContent = `${lat.toFixed(6)}, ${lon.toFixed(6)}`;
                    popup.append(document.createElement("br"), coords);
                    marker.bindPopup(popup);
                    marker.on("mouseover", () => marker.openPopup());

                    // A single click also navigates, when the marker is one node with a dashboard
                    const only = group.length === 1 ? group[0] : null;
                    if (only && only.node_id) marker.on("click", () => {
                        window.location.href = `/dashboard?node=${encodeURIComponent(only.node_id)}`;
                    });
                });

                // No zoom animation: the basemap fetched its tiles for the frames
                // of the animation, and the edge of the final view could stay blank.
                if (bounds.length > 1) map.fitBounds(bounds, { padding: [50, 50], animate: false });
                else map.setView(bounds[0], 16, { animate: false });
            })
            .catch(e => { status.textContent = `Error loading nodes: ${e.message}`; console.error(e); });
    }

    load(); // nodes do not move: loaded once per page view
})();
</script>
{% endblock %}
