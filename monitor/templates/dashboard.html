{% extends "base.html" %}

{% block head %}
<style>
  .dash-header {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 10px 20px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
  }
  .dash-header h2 { margin: 0; font-size: 18px; color: var(--accent); }
  .dash-header h2 small { color: var(--muted); font-weight: 400; font-size: 13px; }
  .dash-header .back { color: var(--muted); text-decoration: none; font-size: 13px; }
  .dash-header .back:hover { color: var(--accent); }
  .dash-header .ws-dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: var(--faint); margin-left: auto;
      transition: background .4s;
  }
  .dash-header .ws-dot.live { background: var(--accent); }
  .dash-header .dash-error { color: var(--danger); font-size: 13px; }

  /* As many columns as fit, each card a readable height; the page scrolls
     instead of squeezing every chart into the window (a small laptop screen,
     or Windows scaling the page to 125-150 %). */
  .charts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      grid-auto-rows: 240px;
      gap: 14px;
      padding: 14px;
      height: calc(100vh - 46px - 54px);
      overflow-y: auto;
  }
  .chart-card {
      background: var(--panel);
      border-radius: 10px;
      border: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-height: 0;
      min-width: 0;
  }
  .card-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      display: flex;
      justify-content: space-between;
      align-items: baseline;
  }
  .card-title small { color: var(--faint); font-weight: 400; }
  .card-title .live-val {
      font-size: 15px;
      color: var(--accent);
      font-weight: 700;
  }
  .card-ts { font-size: 11px; color: var(--muted); }

  .chart-box { position: relative; flex: 1; min-height: 0; }

  @keyframes valFlash {
      0%   { color: #fff; }
      100% { color: var(--accent); }
  }
</style>
{% endblock %}

{% block content %}
<div class="dash-header">
    <a href="/map" class="back">← Map</a>
    <h2>{{ node_name or node_id }}{% if node_name %} <small>{{ node_id }}</small>{% endif %}</h2>
    <span class="dash-error" id="dash-error"></span>
    <div class="ws-dot" id="ws-dot" title="WebSocket status"></div>
</div>

<div class="charts-grid" id="charts-grid"></div>

<script>
(function () {
    "use strict";

    const NODE_ID = {{ node_id | tojson }};
    // Temperature and humidity only for a node that carries the SHT4X.
    const HAS_ENVIRONMENT = {{ environment | tojson }};

    const css = getComputedStyle(document.documentElement);
    const MUTED = css.getPropertyValue("--muted").trim();
    const GRID  = css.getPropertyValue("--border").trim();

    // ── Field metadata (no GPS fields) ───────────────────────────────
    const FIELDS = [
        // Environment
        { key: "temperature",   label: "Temperature",     unit: "°C",  color: "#ff9e64", env: true },
        { key: "humidity",      label: "Humidity",        unit: "%",   color: "#7dcfff", env: true },
        // Device. Uptime is not a chart: the map shows it on each node.
        { key: "battery_level", label: "Battery",         unit: "%",   color: "#67ea94" },
        { key: "voltage",       label: "Voltage",         unit: "V",   color: "#b4f9c8" },
        { key: "channel_util",  label: "Channel Util",    unit: "%",   color: "#c3a6ff" },
        { key: "air_util_tx",   label: "Air Util TX",     unit: "%",   color: "#ff7ab8" },
        // How each packet arrived
        { key: "rssi",          label: "RSSI Rx Message", unit: "dBm", color: "#67ea94" },
        { key: "snr",           label: "SNR Rx Message",  unit: "dB",  color: "#9ece6a" },
        { key: "hop",           label: "Hops Rx Message", unit: "",    color: "#e0af68" },
    ].filter(f => HAS_ENVIRONMENT || !f.env);

    // topic suffix → which fields it carries
    const TOPIC_FIELDS = {
        environment: ["temperature", "humidity"],
        rx_metrics:  ["rssi", "snr", "hop"],
        device:      ["battery_level", "voltage", "channel_util", "air_util_tx"],
    };

    const MAX_POINTS = 120;

    // ── State ────────────────────────────────────────────────────────
    const charts   = {};   // key → Chart instance
    const liveVals = {};   // key → value span
    const tsEls    = {};   // key → received-at span

    // ── Helpers ──────────────────────────────────────────────────────
    function fmtTime(d) {
        // d is a Date or ms-since-epoch number
        return new Date(d).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
    }

    function fmtVal(v) {
        if (v === null || v === undefined) return "—";
        return typeof v === "number" ? v.toFixed(3) : String(v);
    }

    // ── Chart factory ────────────────────────────────────────────────
    function createChart(field) {
        const { key, label, unit, color } = field;

        const card = document.createElement("div");
        card.className = "chart-card";
        card.innerHTML = `
            <div class="card-title">
                <span>${label} <small>${unit ? "(" + unit + ")" : ""}</small></span>
                <span class="live-val">—</span>
            </div>
            <div class="card-ts">Received: <span class="ts-recv">—</span></div>
            <div class="chart-box"><canvas></canvas></div>`;
        document.getElementById("charts-grid").appendChild(card);

        liveVals[key] = card.querySelector(".live-val");
        tsEls[key] = card.querySelector(".ts-recv");

        charts[key] = new Chart(card.querySelector("canvas").getContext("2d"), {
            type: "line",
            data: {
                datasets: [{
                    label: unit ? `${label} (${unit})` : label,
                    data: [],
                    borderColor: color,
                    backgroundColor: color + "18",
                    borderWidth: 1.8,
                    pointRadius: 1.0,
                    fill: true,
                    tension: 0.3,
                }]
            },
            options: {
                animation: false,
                responsive: true,
                maintainAspectRatio: false,
                interaction: { mode: "index", intersect: false },
                scales: {
                    x: {
                        type: "time",
                        time: {
                            tooltipFormat: "HH:mm:ss",
                            displayFormats: { second: "HH:mm:ss", minute: "HH:mm" },
                        },
                        ticks: { color: MUTED, maxTicksLimit: 6, maxRotation: 0 },
                        grid:  { color: GRID },
                    },
                    y: {
                        ticks: { color: MUTED },
                        grid:  { color: GRID },
                    }
                },
                plugins: {
                    legend: { display: false },
                    tooltip: { titleColor: "#ccc", bodyColor: "#eee" },
                }
            }
        });
    }

    // ── Push a new point ─────────────────────────────────────────────
    function pushPoint(key, value, receivedAt) {
        const chart = charts[key];
        if (!chart) return;

        const ds = chart.data.datasets[0];
        ds.data.push({ x: new Date(receivedAt * 1000), y: value });
        if (ds.data.length > MAX_POINTS) ds.data.shift();
        chart.update("none");

        const el = liveVals[key];
        el.textContent = fmtVal(value);
        el.style.animation = "none";
        void el.offsetWidth;
        el.style.animation = "valFlash .5s ease-out";

        tsEls[key].textContent = fmtTime(receivedAt * 1000);
    }

    // ── Seed charts from historical data ─────────────────────────────
    async function seedChart(key) {
        try {
            const r = await fetch(`/api/recent/${encodeURIComponent(NODE_ID)}/${key}?limit=${MAX_POINTS}`);
            const rows = await r.json();
            if (!r.ok) {
                // Say why the history is missing instead of drawing empty charts.
                document.getElementById("dash-error").textContent =
                    `History unavailable: ${rows.error || "HTTP " + r.status}`;
                return;
            }
            if (!rows.length) return;

            charts[key].data.datasets[0].data = rows.map(row => ({
                x: Date.parse(row.time),
                y: row[key],
            }));
            charts[key].update("none");

            const last = rows[rows.length - 1];
            liveVals[key].textContent = fmtVal(last[key]);
            tsEls[key].textContent = fmtTime(Date.parse(last.time));
        } catch(e) {
            console.warn(`[seed] ${key}:`, e);
        }
    }

    // ── Socket.IO ────────────────────────────────────────────────────
    const socket = io({ transports: ["websocket", "polling"] });
    const dot    = document.getElementById("ws-dot");

    socket.on("connect",    () => dot.classList.add("live"));
    socket.on("disconnect", () => dot.classList.remove("live"));

    socket.on("mqtt_message", (payload) => {
        if (payload.node_id !== NODE_ID) return;

        const msgType  = payload._type;
        if (!["position", "device", "environment"].includes(msgType)) return;
        // RSSI, SNR and hop ride on every telemetry packet: no topic is called
        // rx_metrics, so looking that key up by topic never updated those charts.
        const fields   = [...(TOPIC_FIELDS[msgType] || []), ...TOPIC_FIELDS.rx_metrics];

        const receivedAt = payload.received_at;
        if (!receivedAt) return;

        fields.forEach(key => {
            if (payload[key] !== undefined && payload[key] !== null) {
                pushPoint(key, payload[key], receivedAt);
            }
        });
    });

    // ── Init ─────────────────────────────────────────────────────────
    FIELDS.forEach(f => createChart(f));
    FIELDS.forEach(f => seedChart(f.key));
})();
</script>
{% endblock %}
