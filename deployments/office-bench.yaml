# deployments/office-bench.yaml — three SenseCAPs and the gateway's T-Beam on
# an office desk: the meshtastic-gateway stack end to end, on the bench.
#
# The radio block is mini.yaml's on purpose: N1-N3 were provisioned from mini,
# so the gateway radio must share its channel, key and slot to hear them.
#
#   1. Flash the T-Beam with 2.7.26 (docs/flashing.md, ESP32 route, full erase).
#   2. python configure.py inspect -d office-bench --node GW --port /dev/serial/by-id/...
#      Copy node_id, mac and firmware into GW below; set status: deployed.
#   3. python configure.py validate -d office-bench
#   4. python configure.py provision -d office-bench --node GW --port ... (--dry-run first)
#   5. Copy this file, unchanged, to meshtastic-gateway/deployments/.
#
# A bench runs at each chip's minimum power: radios centimetres apart at field
# power saturate each other. N1-N3 still run mini's 22 dBm until they are
# re-provisioned from this file (same channel; only the power changes).

meta:
  deployment: office-bench
  kind: bench
  description: office desk — three SenseCAP nodes and the gateway's T-Beam
  firmware_target: "2.7.26"

radio:
  region: ANZ
  modem_preset: MEDIUM_FAST
  channel_num: 45
  channels:
    - {index: 0, name: miniT, psk_env: MINI_PSK}
  rebroadcast_mode: LOCAL_ONLY
  position_precision: 32
  rx_boosted_gain: true
  eirp_caps: []                  # a bench runs at the chip minimum, below any cap

nodes:
  - ref: N1
    function: node
    status: deployed
    node_id: "!886217f0"
    mac: "C7:8E:88:62:17:F0"
    hardware: sensecap_solar_node_p1_pro
    mcu: nrf52840
    firmware: "2.7.26"
    role: CLIENT
    hop_limit: 1
    antenna: {type: rubber, gain_dbi: 2.0, band_mhz: [902, 928], model: SenseCAP stock}
    tx_power_dbm: -9
    intervals: {device: 60}
    sensors: []

  - ref: N2
    function: node
    status: deployed
    node_id: "!99546767"
    mac: "E4:33:99:54:67:67"
    hardware: sensecap_solar_node_p1_pro
    mcu: nrf52840
    firmware: "2.7.26"
    role: CLIENT
    hop_limit: 1
    antenna: {type: rubber, gain_dbi: 2.0, band_mhz: [902, 928], model: SenseCAP stock}
    tx_power_dbm: -9
    intervals: {device: 60}
    sensors: []

  - ref: N3
    function: node
    status: deployed
    node_id: "!403192d7"
    mac: "F5:1B:40:31:92:D7"
    hardware: sensecap_solar_node_p1_pro
    mcu: nrf52840
    firmware: "2.7.26"
    role: CLIENT
    hop_limit: 1
    antenna: {type: rubber, gain_dbi: 2.0, band_mhz: [902, 928], model: SenseCAP stock}
    tx_power_dbm: -9
    intervals: {device: 60}
    sensors: []

  # The gateway radio: plugged into pi7, read by meshtastic-gateway. Listens and
  # never relays (I5), so it does not contaminate its own measurement.
  - ref: GW
    function: gateway
    status: planned
    node_id: "!6c74104c"
    mac: "A0:DD:6C:74:10:4C"
    hardware: lilygo_tbeam_sx1276
    mcu: esp32
    firmware: "2.7.26"
    role: CLIENT_MUTE
    hop_limit: 1
    antenna: {type: rubber, gain_dbi: 2.0, band_mhz: null, model: LILYGO stock}
    tx_power_dbm: 2
    intervals: {}
    sensors: []
