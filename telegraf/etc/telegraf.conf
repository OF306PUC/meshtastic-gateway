# MQTT topics -> the three InfluxDB measurements (docs/design.md §2.5).
#
# ${MQTT_TOPIC_PREFIX} comes from .env through docker-compose.yaml, the same
# variable the gateway publishes under and the broker ACL is rendered from: a
# topic nobody here subscribes to is accepted by the broker and lost (G4).
# tests/test_infrastructure.py checks this file against gateway/publish.py.
# Credentials come from secrets/telegraf.env; the database name from .env.

[agent]
  interval = "1s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "10s"
  flush_jitter = "0s"
  precision = ""
  hostname = ""
  omit_hostname = false

[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  username = "${MQTT_USERNAME_TELEGRAF}"
  password = "${MQTT_PASSWORD_TELEGRAF}"
  topics = [
    "${MQTT_TOPIC_PREFIX}/+/position",
    "${MQTT_TOPIC_PREFIX}/+/device",
    "${MQTT_TOPIC_PREFIX}/+/environment"
  ]
  qos = 0
  connection_timeout = "30s"
  name_override = "telemetry"
  data_format = "json"
  json_time_key    = "received_at"
  json_time_format = "unix"
  tag_keys = ["node_id", "node_label"]


[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  username = "${MQTT_USERNAME_TELEGRAF}"
  password = "${MQTT_PASSWORD_TELEGRAF}"
  topics = ["${MQTT_TOPIC_PREFIX}/+/message"]
  qos = 0
  connection_timeout = "30s"
  name_override = "pbx_message"
  data_format = "json"
  json_time_key = "received_at"
  json_time_format = "unix"
  tag_keys = ["node_id", "node_label", "portnum", "channel", "src_id", "dst_id"]

[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  username = "${MQTT_USERNAME_TELEGRAF}"
  password = "${MQTT_PASSWORD_TELEGRAF}"
  topics = ["${MQTT_TOPIC_PREFIX}/+/pdr"]
  qos = 0
  connection_timeout = "30s"
  name_override = "pdr"
  data_format = "json"
  json_time_key = "received_at"
  json_time_format = "unix"
  tag_keys = ["node_label", "flow", "source"]

[[outputs.influxdb]]
  urls = ["http://influxdb:8086"]
  database = "${INFLUXDB_DB}"
  # The write-only account. influxdb creates the database itself on first start.
  username = "${INFLUXDB_WRITE_USER}"
  password = "${INFLUXDB_WRITE_USER_PASSWORD}"
  skip_database_creation = true
  retention_policy = ""
  write_consistency = "any"
  timeout = "5s"
