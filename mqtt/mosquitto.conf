# TCP only: every client is a container on the compose network. No websocket
# listener — nothing used it, and each listener is one more way in.
listener 1883

# Persistence
persistence true
persistence_file mosquitto.db
persistence_location /mosquitto/data/

# Authentication
#
# Anonymous access would let anyone who reaches port 1883 publish into the
# measurement namespace. For a measurement testbed that is a DATA INTEGRITY
# problem before it is a security one — injected telemetry is
# indistinguishable from real data afterwards, and the receiver cannot filter
# it out, because it checks a node_id carried INSIDE the payload the writer
# controls.
#
# pwfile is not in git. Generate it with ./mqtt/init-credentials.sh BEFORE the
# first `docker compose up`, together with secrets/ (G5), or every
# client is refused with rc=5 and the pipeline goes silent.
allow_anonymous false
password_file /mosquitto/config/pwfile

# Rendered from mqtt/aclfile.template by mqtt/entrypoint.sh at every start.
acl_file /mosquitto/aclfile
